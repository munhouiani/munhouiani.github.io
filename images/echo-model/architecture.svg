<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Architecture: the real workspace, the training loop and evaluation around one simulator">
<title>Architecture: the real workspace, the training loop and evaluation around one simulator</title>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .leader { stroke: #898781; stroke-width: 1; fill: none; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; } .s4 { fill: #eda100; stroke: #eda100; }
  .ref { fill: #898781; stroke: #898781; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .link { stroke: #c3c2b7; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; } .s4 { fill: #c98500; stroke: #c98500; }
    .ring { stroke: #1a1a19; } .link { stroke: #383835; }
    .line { fill: none; }
  }
</style>
<rect class="surface" x="0" y="0" width="760" height="520"/>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M10,0 L0,5 L10,10 z"/></marker>
</defs>
<style>
  .node { fill: #f0efec; stroke: #c3c2b7; stroke-width: 1; } .sim { fill: #cde2fb; stroke: #86b6ef; stroke-width: 1; }
  .arrow { stroke: #898781; stroke-width: 1.5; } .arrowhead { fill: #898781; } .lane { fill: #898781; }
  @media (prefers-color-scheme: dark) { .node { fill: #2c2c2a; stroke: #383835; } .sim { fill: #104281; stroke: #2a78d6; } }
</style>
<text class="ink" x="24.0" y="26.0" font-size="15" text-anchor="start" font-weight="600">The environment: one simulator, three uses</text>
<text class="lane" x="24.0" y="58.0" font-size="11" text-anchor="start" font-weight="600">GROUND TRUTH</text>
<rect class="node" x="24" y="66" width="220" height="92" rx="6"/>
<text class="ink" x="36.0" y="86.0" font-size="13" text-anchor="start" font-weight="600">Databricks Free Edition</text>
<text class="ink2" x="36.0" y="104.0" font-size="11.5" text-anchor="start" font-weight="normal">the real workspace, serverless</text>
<text class="ink2" x="36.0" y="120.0" font-size="11.5" text-anchor="start" font-weight="normal">DBR 19.12, Spark 4.2.0</text>
<line class="arrow" x1="244" y1="112" x2="290" y2="112" marker-end="url(#head)"/>
<rect class="node" x="292" y="66" width="196" height="92" rx="6"/>
<text class="ink" x="304.0" y="86.0" font-size="13" text-anchor="start" font-weight="600">Golden files</text>
<text class="ink2" x="304.0" y="104.0" font-size="11.5" text-anchor="start" font-weight="normal">10 scenarios, 120 statements,</text>
<text class="ink2" x="304.0" y="120.0" font-size="11.5" text-anchor="start" font-weight="normal">captured and scrubbed</text>
<line class="arrow" x1="488" y1="112" x2="532" y2="112" marker-end="url(#head)"/>
<rect class="node" x="534" y="66" width="202" height="92" rx="6"/>
<text class="ink" x="546.0" y="86.0" font-size="13" text-anchor="start" font-weight="600">Fidelity test</text>
<text class="ink2" x="546.0" y="104.0" font-size="11.5" text-anchor="start" font-weight="normal">every field diffed, 570 diffs</text>
<text class="ink2" x="546.0" y="120.0" font-size="11.5" text-anchor="start" font-weight="normal">each labelled match, emulate,</text>
<text class="ink2" x="546.0" y="136.0" font-size="11.5" text-anchor="start" font-weight="normal">template or gap</text>
<text class="lane" x="24.0" y="196.0" font-size="11" text-anchor="start" font-weight="600">TRAINING</text>
<rect class="node" x="24" y="204" width="300" height="124" rx="6"/>
<text class="ink" x="36.0" y="224.0" font-size="13" text-anchor="start" font-weight="600">Trainer, 1 × H200 per arm</text>
<text class="ink2" x="36.0" y="242.0" font-size="11.5" text-anchor="start" font-weight="normal">NeMo RL: GRPO on Megatron,</text>
<text class="ink2" x="36.0" y="258.0" font-size="11.5" text-anchor="start" font-weight="normal">rollouts on vLLM (eager)</text>
<text class="ink2" x="36.0" y="274.0" font-size="11.5" text-anchor="start" font-weight="normal">ECHO: + λ · CE on every tool-output</text>
<text class="ink2" x="36.0" y="290.0" font-size="11.5" text-anchor="start" font-weight="normal">token, normalized per episode</text>
<line class="arrow" x1="324" y1="266" x2="432" y2="266" marker-end="url(#head)" marker-start="url(#tail)"/>
<text class="muted" x="378.0" y="260.0" font-size="11" text-anchor="middle" font-weight="normal">HTTPS, token</text>
<rect class="sim" x="434" y="204" width="302" height="124" rx="6"/>
<text class="ink" x="446.0" y="224.0" font-size="13" text-anchor="start" font-weight="600">Episode service, 32 CPU per arm</text>
<text class="ink2" x="446.0" y="242.0" font-size="11.5" text-anchor="start" font-weight="normal">adapter: render, parse tool calls,</text>
<text class="ink2" x="446.0" y="258.0" font-size="11.5" text-anchor="start" font-weight="normal">observation masks for the ECHO loss</text>
<text class="ink2" x="446.0" y="274.0" font-size="11.5" text-anchor="start" font-weight="normal">Python kernel per episode</text>
<text class="ink2" x="446.0" y="290.0" font-size="11.5" text-anchor="start" font-weight="normal">verifier at episode end: reward</text>
<text class="lane" x="24.0" y="364.0" font-size="11" text-anchor="start" font-weight="600">EVALUATION</text>
<rect class="node" x="24" y="372" width="300" height="108" rx="6"/>
<text class="ink" x="36.0" y="392.0" font-size="13" text-anchor="start" font-weight="600">Model server, 1 × L40S</text>
<text class="ink2" x="36.0" y="410.0" font-size="11.5" text-anchor="start" font-weight="normal">vLLM (eager), OpenAI-compatible API</text>
<text class="ink2" x="36.0" y="426.0" font-size="11.5" text-anchor="start" font-weight="normal">temperature 0.6, top-p 1.0,</text>
<text class="ink2" x="36.0" y="442.0" font-size="11.5" text-anchor="start" font-weight="normal">1,024 tokens per turn</text>
<line class="arrow" x1="324" y1="426" x2="432" y2="426" marker-end="url(#head)" marker-start="url(#tail)"/>
<text class="muted" x="378.0" y="420.0" font-size="11" text-anchor="middle" font-weight="normal">chat + tool calls</text>
<rect class="sim" x="434" y="372" width="302" height="108" rx="6"/>
<text class="ink" x="446.0" y="392.0" font-size="13" text-anchor="start" font-weight="600">Eval container per split, 8 CPU</text>
<text class="ink2" x="446.0" y="410.0" font-size="11.5" text-anchor="start" font-weight="normal">harness: 16 turns, k = 4 samples</text>
<text class="ink2" x="446.0" y="426.0" font-size="11.5" text-anchor="start" font-weight="normal">its own fresh simulator</text>
<text class="ink2" x="446.0" y="442.0" font-size="11.5" text-anchor="start" font-weight="normal">verifier in a new session: pass@k</text>
<line class="arrow" x1="635" y1="204" x2="635" y2="160" marker-end="url(#head)"/>
<text class="muted" x="643.0" y="186.0" font-size="11" text-anchor="start" font-weight="normal">same simulator</text>
<text class="muted" x="24.0" y="506.0" font-size="11" text-anchor="start" font-weight="normal">Blue: runs the simulator (Spark Connect 4.2 + Delta Lake 4.4 + a Databricks shim). Agent SQL never leaves its episode's schema.</text>
</svg>
