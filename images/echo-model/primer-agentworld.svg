<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-label="Qwen-AgentWorld: a separate world model trained with cross-entropy on observation turns, with echo turns mostly masked">
<title>Qwen-AgentWorld: a separate world model trained with cross-entropy on observation turns, with echo turns mostly masked</title>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .leader { stroke: #898781; stroke-width: 1; fill: none; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; } .s4 { fill: #eda100; stroke: #eda100; }
  .ref { fill: #898781; stroke: #898781; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .link { stroke: #c3c2b7; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; } .s4 { fill: #c98500; stroke: #c98500; }
    .ring { stroke: #1a1a19; } .link { stroke: #383835; }
    .line { fill: none; }
  }
</style>
<rect class="surface" x="0" y="0" width="760" height="446"/>
<defs>
  <marker id="flowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="flowhead" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  .tk-ce { fill: #6250d6; } .tk-adv { fill: #e87ba4; } .tk-env { fill: #eda100; }
  .tk-off { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .band { fill: #f0efec; stroke: #c3c2b7; stroke-width: 1; } .focus { fill: #f0efec; }
  .flow { stroke: #898781; stroke-width: 1.5; fill: none; } .flowhead { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .tk-ce { fill: #9085e9; } .tk-adv { fill: #d55181; } .tk-env { fill: #c98500; }
    .tk-off { stroke: #52514e; } .band { fill: #2c2c2a; stroke: #383835; } .focus { fill: #2c2c2a; }
  }
</style>
<text class="ink" x="24.0" y="22.0" font-size="15" text-anchor="start" font-weight="600">Qwen-AgentWorld: a separate model, trained only to predict the environment</text>
<text class="ink2" x="24.0" y="42.0" font-size="12" text-anchor="start" font-weight="normal">The tool calls of Figure 4, with a fuller output and a second call. The turn categories are illustrative.</text>
<rect class="tk-adv" x="24" y="55" width="22" height="14" rx="3"/>
<text class="ink2" x="52.0" y="66.0" font-size="12" text-anchor="start" font-weight="normal">in the loss, weighted by the advantage A</text>
<rect class="tk-env" x="330.0" y="55" width="22" height="14" rx="3"/>
<text class="ink2" x="358.0" y="66.0" font-size="12" text-anchor="start" font-weight="normal">in the observation loss: cross-entropy × λ</text>
<rect class="tk-ce" x="24" y="75" width="22" height="14" rx="3"/>
<text class="ink2" x="52.0" y="86.0" font-size="12" text-anchor="start" font-weight="normal">in the loss: cross-entropy, −log p</text>
<rect class="tk-off" x="292.2" y="75" width="22" height="14" rx="3"/>
<text class="ink2" x="320.2" y="86.0" font-size="12" text-anchor="start" font-weight="normal">not in the loss</text>
<text class="ink" x="24.0" y="118.0" font-size="12" text-anchor="start" font-weight="600">ECHO, as in Figure 4</text>
<rect class="tk-adv" x="24.0" y="128" width="95.8" height="22" rx="4"><title>lookup(Japan): in the loss, weighted by the advantage A</title></rect>
<text class="mono" fill="#0b0b0b" x="71.9" y="143" font-size="11" text-anchor="middle">lookup(Japan)</text>
<rect class="tk-off" x="123.8" y="128" width="49.6" height="22" rx="4"><title>&lt;tool&gt;: not in the loss</title></rect>
<text class="muted mono" x="148.6" y="143" font-size="11" text-anchor="middle">&lt;tool&gt;</text>
<rect class="tk-env" x="177.4" y="128" width="62.8" height="22" rx="4"><title>country:: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="208.8" y="143" font-size="11" text-anchor="middle">country:</text>
<rect class="tk-env" x="244.2" y="128" width="43.0" height="22" rx="4"><title>Japan: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="265.7" y="143" font-size="11" text-anchor="middle">Japan</text>
<rect class="tk-env" x="291.2" y="128" width="62.8" height="22" rx="4"><title>capital:: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="322.6" y="143" font-size="11" text-anchor="middle">capital:</text>
<rect class="tk-env" x="358.0" y="128" width="43.0" height="22" rx="4"><title>Tokyo: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="379.5" y="143" font-size="11" text-anchor="middle">Tokyo</text>
<rect class="tk-env" x="405.0" y="128" width="43.0" height="22" rx="4"><title>time:: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="426.5" y="143" font-size="11" text-anchor="middle">time:</text>
<rect class="tk-env" x="452.0" y="128" width="43.0" height="22" rx="4"><title>10:42: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="473.5" y="143" font-size="11" text-anchor="middle">10:42</text>
<text class="ink2" x="507.0" y="143.0" font-size="12" text-anchor="start" font-weight="normal">the policy, learning both</text>
<rect class="tk-adv" x="24.0" y="158" width="95.8" height="22" rx="4"><title>submit(Tokyo): in the loss, weighted by the advantage A</title></rect>
<text class="mono" fill="#0b0b0b" x="71.9" y="173" font-size="11" text-anchor="middle">submit(Tokyo)</text>
<rect class="tk-off" x="123.8" y="158" width="49.6" height="22" rx="4"><title>&lt;tool&gt;: not in the loss</title></rect>
<text class="muted mono" x="148.6" y="173" font-size="11" text-anchor="middle">&lt;tool&gt;</text>
<rect class="tk-env" x="177.4" y="158" width="76.0" height="22" rx="4"><title>submitted:: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="215.4" y="173" font-size="11" text-anchor="middle">submitted:</text>
<rect class="tk-env" x="257.4" y="158" width="43.0" height="22" rx="4"><title>Tokyo: in the loss: cross-entropy × λ</title></rect>
<text class="mono" fill="#0b0b0b" x="278.9" y="173" font-size="11" text-anchor="middle">Tokyo</text>
<text class="ink" x="24.0" y="210.0" font-size="12" text-anchor="start" font-weight="600">Qwen-AgentWorld: the agent's calls become user turns, the outputs become the world model's answers</text>
<rect class="tk-off" x="24.0" y="220" width="49.6" height="22" rx="4"><title>&lt;user&gt;: not in the loss</title></rect>
<text class="muted mono" x="48.8" y="235" font-size="11" text-anchor="middle">&lt;user&gt;</text>
<rect class="tk-off" x="77.6" y="220" width="95.8" height="22" rx="4"><title>lookup(Japan): not in the loss</title></rect>
<text class="muted mono" x="125.5" y="235" font-size="11" text-anchor="middle">lookup(Japan)</text>
<rect class="tk-off" x="177.4" y="220" width="82.6" height="22" rx="4"><title>&lt;assistant&gt;: not in the loss</title></rect>
<text class="muted mono" x="218.7" y="235" font-size="11" text-anchor="middle">&lt;assistant&gt;</text>
<rect class="tk-ce" x="264.0" y="220" width="62.8" height="22" rx="4"><title>country:: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="295.4" y="235" font-size="11" text-anchor="middle">country:</text>
<rect class="tk-ce" x="330.8" y="220" width="43.0" height="22" rx="4"><title>Japan: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="352.3" y="235" font-size="11" text-anchor="middle">Japan</text>
<rect class="tk-ce" x="377.8" y="220" width="62.8" height="22" rx="4"><title>capital:: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="409.2" y="235" font-size="11" text-anchor="middle">capital:</text>
<rect class="tk-ce" x="444.6" y="220" width="43.0" height="22" rx="4"><title>Tokyo: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="466.1" y="235" font-size="11" text-anchor="middle">Tokyo</text>
<rect class="tk-ce" x="491.6" y="220" width="43.0" height="22" rx="4"><title>time:: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="513.1" y="235" font-size="11" text-anchor="middle">time:</text>
<rect class="tk-ce" x="538.6" y="220" width="43.0" height="22" rx="4"><title>10:42: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="560.1" y="235" font-size="11" text-anchor="middle">10:42</text>
<text class="ink2" x="593.6" y="235.0" font-size="12" text-anchor="start" font-weight="normal">retrieval turn: 100% kept</text>
<rect class="tk-off" x="24.0" y="250" width="49.6" height="22" rx="4"><title>&lt;user&gt;: not in the loss</title></rect>
<text class="muted mono" x="48.8" y="265" font-size="11" text-anchor="middle">&lt;user&gt;</text>
<rect class="tk-off" x="77.6" y="250" width="95.8" height="22" rx="4"><title>submit(Tokyo): not in the loss</title></rect>
<text class="muted mono" x="125.5" y="265" font-size="11" text-anchor="middle">submit(Tokyo)</text>
<rect class="tk-off" x="177.4" y="250" width="82.6" height="22" rx="4"><title>&lt;assistant&gt;: not in the loss</title></rect>
<text class="muted mono" x="218.7" y="265" font-size="11" text-anchor="middle">&lt;assistant&gt;</text>
<rect class="tk-off" x="264.0" y="250" width="76.0" height="22" rx="4"><title>submitted:: not in the loss</title></rect>
<text class="muted mono" x="302.0" y="265" font-size="11" text-anchor="middle">submitted:</text>
<rect class="tk-off" x="344.0" y="250" width="43.0" height="22" rx="4"><title>Tokyo: not in the loss</title></rect>
<text class="muted mono" x="365.5" y="265" font-size="11" text-anchor="middle">Tokyo</text>
<text class="ink2" x="399.0" y="265.0" font-size="12" text-anchor="start" font-weight="normal">echo turn: 5% kept, the rest read as context</text>
<text class="ink2" x="24.0" y="308.0" font-size="12" text-anchor="start" font-weight="normal">No policy and no reward: next-token cross-entropy on the environment&#x27;s turns is the whole objective.</text>
<text class="ink2" x="24.0" y="327.0" font-size="12" text-anchor="start" font-weight="normal">Each turn is categorized from four statistics of its (call, output) pair: how much the output overlaps the call,</text>
<text class="ink2" x="24.0" y="346.0" font-size="12" text-anchor="start" font-weight="normal">how much is new, word-set similarity and length ratio. Keep ratios: retrieval, expansion, action and other 100%;</text>
<text class="ink2" x="24.0" y="365.0" font-size="12" text-anchor="start" font-weight="normal">transform 50%; boilerplate 10%; echo 5%.</text>
<text class="ink2" x="24.0" y="384.0" font-size="12" text-anchor="start" font-weight="normal">The world model then simulates environments for a policy&#x27;s RL, or serves as a warm-up stage before it.</text>
<text class="muted" x="24.0" y="418.0" font-size="11" text-anchor="start" font-weight="normal">In the world model&#x27;s format, &lt;assistant&gt; is the world model: it writes what the tool returns.</text>
</svg>
