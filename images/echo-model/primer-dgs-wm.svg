<text class="mono" fill="#0b0b0b" x="546.9" y="125" font-size="11" text-anchor="middle">submit(Tokyo)</text>
<text class="ink" x="24.0" y="168.0" font-size="12" text-anchor="start" font-weight="600">DGS-WM</text>
<rect class="tk-adv" x="24.0" y="206" width="95.8" height="22" rx="4"><title>lookup(Japan): in the loss, weighted by the advantage A</title></rect>
<text class="mono" fill="#0b0b0b" x="71.9" y="221" font-size="11" text-anchor="middle">lookup(Japan)</text>
<rect class="tk-off" x="123.8" y="206" width="49.6" height="22" rx="4"><title>&lt;tool&gt;: not in the loss</title></rect>
<text class="muted mono" x="148.6" y="221" font-size="11" text-anchor="middle">&lt;tool&gt;</text>
<rect class="tk-off" x="177.4" y="206" width="62.8" height="22" rx="4"><title>country:: not in the loss</title></rect>
<text class="muted mono" x="208.8" y="221" font-size="11" text-anchor="middle">country:</text>
<rect class="tk-off" x="244.2" y="206" width="43.0" height="22" rx="4"><title>Japan: not in the loss</title></rect>
<text class="muted mono" x="265.7" y="221" font-size="11" text-anchor="middle">Japan</text>
