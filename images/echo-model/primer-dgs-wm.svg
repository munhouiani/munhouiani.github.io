<text class="ink" x="24.0" y="22.0" font-size="15" text-anchor="start" font-weight="600">DGS-WM: ECHO's loss on the parts of an output that drive the next action</text>
<text class="ink2" x="24.0" y="42.0" font-size="12" text-anchor="start" font-weight="normal">The first tool call of Figure 4, with a fuller output, and the agent's next action. Scores are illustrative.</text>
