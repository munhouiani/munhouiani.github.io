<path class="leader" d="M178.4,201 V196 H286.2 V201"/>
<text class="ink2" x="232.3" y="190.0" font-size="11" text-anchor="middle" font-weight="normal">s = −2.1</text>
<path class="leader" d="M292.2,201 V196 H400.0 V201"/>
<text class="ink2" x="346.1" y="190.0" font-size="11" text-anchor="middle" font-weight="normal">s = −0.3: kept</text>
<path class="leader" d="M406.0,201 V196 H494.0 V201"/>
<text class="ink2" x="450.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal">s = −2.4</text>
<path class="leader" d="M500.0,201 V196 H593.8 V201"/>
<text class="ink2" x="546.9" y="190.0" font-size="11" text-anchor="middle" font-weight="normal">next action</text>
<text class="ink2" x="346.1" y="246.0" font-size="10.5" text-anchor="middle" font-weight="normal">q = 0.6, weight 0.4</text>
<text class="ink2" x="24.0" y="284.0" font-size="12" text-anchor="start" font-weight="normal">Which: the output is split into minimal units of meaning (here a field; a sentence in the paper&#x27;s QA). A unit&#x27;s</text>
<text class="ink2" x="24.0" y="303.0" font-size="12" text-anchor="start" font-weight="normal">score s is the average log-likelihood of the agent&#x27;s actual next action when that unit alone stands in for the</text>
<text class="ink2" x="24.0" y="322.0" font-size="12" text-anchor="start" font-weight="normal">output. Units scoring above the output&#x27;s mean + 0.5 std are kept. If none is, the call adds nothing.</text>
<text class="ink2" x="24.0" y="341.0" font-size="12" text-anchor="start" font-weight="normal">How much: a kept unit&#x27;s cross-entropy is weighted by 1 − q, where q is the model&#x27;s confidence on it (the geometric</text>
<text class="ink2" x="24.0" y="360.0" font-size="12" text-anchor="start" font-weight="normal">mean of its token probabilities, held fixed in the gradient). What the model already predicts weighs less.</text>
<text class="ink" x="24.0" y="387.0" font-size="12" text-anchor="start" font-weight="normal">DGS-WM&#x27;s loss = RL loss + 0.02 · Σ over kept units of (1 − q) · (−log p), per kept token</text>
</svg>
