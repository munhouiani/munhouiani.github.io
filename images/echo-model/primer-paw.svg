<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-label="PaW: ECHO's observation loss restricted to uncertain calls and under-predicted tokens, with a bounded cost per token">
<title>PaW: ECHO's observation loss restricted to uncertain calls and under-predicted tokens, with a bounded cost per token</title>
<style>
