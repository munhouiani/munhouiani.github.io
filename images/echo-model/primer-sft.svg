<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="Supervised fine-tuning: the prompt is masked and the demonstrated answer is scored with cross-entropy">
<title>Supervised fine-tuning: the prompt is masked and the demonstrated answer is scored with cross-entropy</title>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .leader { stroke: #898781; stroke-width: 1; fill: none; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; } .s4 { fill: #eda100; stroke: #eda100; }
  .ref { fill: #898781; stroke: #898781; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .link { stroke: #c3c2b7; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; } .s4 { fill: #c98500; stroke: #c98500; }
    .ring { stroke: #1a1a19; } .link { stroke: #383835; }
    .line { fill: none; }
  }
</style>
<rect class="surface" x="0" y="0" width="760" height="236"/>
<defs>
  <marker id="flowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="flowhead" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  .tk-ce { fill: #6250d6; } .tk-adv { fill: #e87ba4; } .tk-env { fill: #eda100; }
  .tk-off { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .band { fill: #f0efec; stroke: #c3c2b7; stroke-width: 1; } .focus { fill: #f0efec; }
  .flow { stroke: #898781; stroke-width: 1.5; fill: none; } .flowhead { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .tk-ce { fill: #9085e9; } .tk-adv { fill: #d55181; } .tk-env { fill: #c98500; }
    .tk-off { stroke: #52514e; } .band { fill: #2c2c2a; stroke: #383835; } .focus { fill: #2c2c2a; }
  }
</style>
<text class="ink" x="24.0" y="22.0" font-size="15" text-anchor="start" font-weight="600">Supervised fine-tuning: the same loss, on a demonstration, with a mask</text>
<text class="ink2" x="24.0" y="42.0" font-size="12" text-anchor="start" font-weight="normal">Each token is colored by how it counts when the model predicts it from the tokens before it.</text>
<rect class="tk-ce" x="24" y="55" width="22" height="14" rx="3"/>
<text class="ink2" x="52.0" y="66.0" font-size="12" text-anchor="start" font-weight="normal">in the loss: cross-entropy, −log p</text>
<rect class="tk-off" x="292.2" y="55" width="22" height="14" rx="3"/>
<text class="ink2" x="320.2" y="66.0" font-size="12" text-anchor="start" font-weight="normal">not in the loss</text>
<rect class="tk-off" x="24.0" y="96" width="49.6" height="22" rx="4"><title>&lt;user&gt;: not in the loss</title></rect>
<text class="muted mono" x="48.8" y="111" font-size="11" text-anchor="middle">&lt;user&gt;</text>
<rect class="tk-off" x="77.6" y="96" width="56.2" height="22" rx="4"><title>Japan&#x27;s: not in the loss</title></rect>
<text class="muted mono" x="105.7" y="111" font-size="11" text-anchor="middle">Japan&#x27;s</text>
<rect class="tk-off" x="137.8" y="96" width="62.8" height="22" rx="4"><title>capital?: not in the loss</title></rect>
<text class="muted mono" x="169.2" y="111" font-size="11" text-anchor="middle">capital?</text>
<rect class="tk-off" x="204.6" y="96" width="56.2" height="22" rx="4"><title>&lt;agent&gt;: not in the loss</title></rect>
<text class="muted mono" x="232.7" y="111" font-size="11" text-anchor="middle">&lt;agent&gt;</text>
<rect class="tk-ce" x="264.8" y="96" width="43.0" height="22" rx="4"><title>Tokyo: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="286.3" y="111" font-size="11" text-anchor="middle">Tokyo</text>
<rect class="tk-ce" x="311.8" y="96" width="16.6" height="22" rx="4"><title>.: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="320.1" y="111" font-size="11" text-anchor="middle">.</text>
<rect class="tk-ce" x="332.4" y="96" width="43.0" height="22" rx="4"><title>&lt;end&gt;: in the loss: cross-entropy, −log p</title></rect>
<text class="mono" fill="#ffffff" x="353.9" y="111" font-size="11" text-anchor="middle">&lt;end&gt;</text>
<path class="leader" d="M25.0,123 V128 H259.8 V123"/>
<text class="ink2" x="142.4" y="143.0" font-size="11" text-anchor="middle" font-weight="normal">the prompt: read, not scored</text>
<path class="leader" d="M265.8,123 V128 H374.4 V123"/>
<text class="ink2" x="264.8" y="143.0" font-size="11" text-anchor="start" font-weight="normal">the demonstrated answer: scored as in pretraining</text>
<text class="ink2" x="24.0" y="182.0" font-size="12" text-anchor="start" font-weight="normal">The loss is pretraining's. What changes is the data, a demonstration in chat format written by a person</text>
<text class="ink2" x="24.0" y="200.0" font-size="12" text-anchor="start" font-weight="normal">or a stronger model, and the mask. In an agent's demonstration the tool outputs are usually masked too.</text>
<text class="muted" x="24.0" y="224.0" font-size="11" text-anchor="start" font-weight="normal">&lt;end&gt; is scored, so the model learns when to stop.</text>
</svg>
