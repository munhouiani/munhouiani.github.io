<text class="ink" x="24.0" y="22.0" font-size="15" text-anchor="start" font-weight="600">ECHO: GRPO, plus learning to predict what the environment returns</text>
<text class="ink2" x="24.0" y="42.0" font-size="12" text-anchor="start" font-weight="normal">One episode with a tool call, and how each token counts under each method.</text>
