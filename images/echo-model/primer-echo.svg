<text class="ink" x="24.0" y="222.0" font-size="12" text-anchor="start" font-weight="normal">ECHO's loss = GRPO's loss on the agent's tokens + λ · (1/|O|) · Σ −log p(each tool-output token)</text>
<text class="ink2" x="24.0" y="242.0" font-size="12" text-anchor="start" font-weight="normal">|O| is the episode's observation length. The logits come from the same forward pass: no extra rollouts.</text>
<text class="muted" x="24.0" y="262.0" font-size="11" text-anchor="start" font-weight="normal">This study: λ = 0.005 and 0.02, on every token of every tool output&#x27;s body (not the &lt;tool&gt; marker).</text>
